<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lives in src/assets, not public/, so Vite gives it a content hash.
         A public/ file keeps the URL /favicon.svg forever, and browsers cache
         favicons by URL in a store a hard refresh does not clear — which is
         why an old icon can stick around for weeks. -->
    <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramon Naula</title>
  </head>
